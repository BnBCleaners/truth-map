site_name: Truth Map
site_description: Neutral, evidence-based research instrument — Claims, Cases, people, organizations, facilities, and timelines
site_url: https://truth-map.github.io/truth-map/
repo_url: https://github.com/Truth-Map/truth-map
repo_name: Truth-Map/truth-map

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - How this works:
    - Purpose & Rules: about/purpose.md
    - Architecture: about/architecture.md
    - How to contribute: about/contributing.md
    - Gatekeeping & Moderation: about/gatekeeping.md
    - Fact-check checklist: about/fact-check-checklist.md
  - Topics:
    - Overview: topics/index.md
    - COVID-19 Origins: topics/covid-19-origins.md
    - Hunter Biden Laptop: topics/hunter-biden-laptop.md
    - Unchecked / Illegal Immigration: topics/unchecked-illegal-immigration.md
  - Claims:
    - Overview: claims/index.md
    - Laptop = Russian disinfo: claims/C-01-laptop-russian-disinfo.md
    - 51-letter “just expert opinion”: claims/C-04-51-letter-expert-opinion.md
    - Manufactured Russia hoax framing: claims/C-06-manufactured-russia-hoax.md
    - Mockingbird never ended: claims/C-11-mockingbird-never-ended.md
    - Lab-leak framing: claims/C-02-lab-leak-is-conspiracy-theory.md
    - GOF funding at WIV: claims/C-03-no-gain-of-function-at-wiv.md
  - Cases:
    - Overview: cases/index.md
    - Unchecked / Illegal Immigration: cases/unchecked-illegal-immigration.md
    - Project Mockingbird: cases/project-mockingbird.md
    - Gabbard COVID / Fauci (2026): cases/gabbard-covid-fauci.md
    - Gabbard 2016 Election: cases/gabbard-2016-election.md
    - Gabbard Biolabs: cases/gabbard-biolabs.md
    - Stock Trading: cases/stock-trading.md
    - Fauci Diary (2026): cases/fauci-diary.md
    - Lancet Letter (2020): cases/lancet-letter.md
    - Proximal Origin (2020): cases/proximal-origin.md
    - Fauci GOF Testimony (2021): cases/fauci-gof-testimony.md
  - Media Influence:
    - Overview: media/index.md
    - Ownership concentration: media/ownership-concentration.md
    - Twitter Files / platforms: media/twitter-files.md
  - People:
    - Early-origins cluster: people/index.md
    - Kristian Andersen: people/kristian-andersen.md
    - Jeremy Farrar: people/jeremy-farrar.md
    - Edward Holmes: people/edward-holmes.md
    - Robert Garry: people/robert-garry.md
    - Andrew Rambaut: people/andrew-rambaut.md
    - Ron Fouchier: people/ron-fouchier.md
    - Christian Drosten: people/christian-drosten.md
    - Peter Daszak: people/peter-daszak.md
    - Joseph Alsop: people/joseph-alsop.md
    - Stewart Alsop: people/stewart-alsop.md
    - Philip L. Graham: people/philip-l-graham.md
  - Organizations:
    - Overview: organizations/index.md
    - Council on Foreign Relations: organizations/cfr.md
    - Bilderberg: organizations/bilderberg.md
    - World Economic Forum: organizations/wef.md
    - Trilateral Commission: organizations/trilateral-commission.md
    - Atlantic Council: organizations/atlantic-council.md
    - Aspen Institute: organizations/aspen-institute.md
    - Chatham House: organizations/chatham-house.md
    - Pilgrims Society: organizations/pilgrims-society.md
    - Skull and Bones: organizations/skull-and-bones.md
