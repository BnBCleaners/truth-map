site_name: Truth Map
site_description: Neutral, evidence-based research instrument — Claims, Cases, people, organizations, facilities, and timelines
site_url: https://truth-map.github.io/truth-map/
repo_url: https://github.com/Truth-Map/truth-map
repo_name: Truth-Map/truth-map

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra_css:
  - stylesheets/extra.css

